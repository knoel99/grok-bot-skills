name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: |
          python3 -m unittest skills/dialogue-turns/scripts/test_dialogue_turns.py
          python3 -m unittest skills/agora-scene/scripts/test_agora.py
